name: Build bgfx Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "bgfx-latest"
      release_name:
        description: "Release name"
        required: true
        default: "bgfx Windows x64"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bgfx
          path: bgfx
          fetch-depth: 1

      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 1

      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio solution
        shell: cmd
        run: |
          cd bgfx
          ..\bx\tools\bin\windows\genie.exe --with-shared-lib vs2022

      - name: Build bgfx
        shell: cmd
        run: |
          cd bgfx
          msbuild .build\projects\vs2022\bgfx.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=x64

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\bin | Out-Null
          New-Item -ItemType Directory -Force -Path release\lib | Out-Null
          New-Item -ItemType Directory -Force -Path release\include | Out-Null

          $build = "bgfx\.build\win64_vs2022\bin"
          $lib = "bgfx\.build\win64_vs2022\lib"

          $dll = Get-ChildItem $build -Filter "bgfx-shared-libRelease.dll" -Recurse |
            Select-Object -First 1

          $implib = Get-ChildItem $lib -Filter "bgfx-shared-libRelease.lib" -Recurse |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "bgfx DLL was not found."
            exit 1
          }

          if (-not $implib) {
            Write-Error "bgfx LIB was not found."
            exit 1
          }

          Copy-Item $dll.FullName release\bin\bgfx.dll
          Copy-Item $implib.FullName release\lib\bgfx.lib

          Copy-Item "bgfx\include\bgfx" release\include -Recurse

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release\* `
            -DestinationPath bgfx-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-windows-x64
          path: bgfx-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          generate_release_notes: true
          files: |
            bgfx-windows-x64.zip

Po uruchomieniu **Actions → Build bgfx Windows → Run workflow** podajesz np.:

```text
release_tag:
bgfx-2026.10.03

release_name:
bgfx Windows x64
````

Release będzie miał:

```text
bgfx-windows-x64.zip
```

a w środku:

```text
release/
├── bin/
│   └── bgfx.dll
├── lib/
│   └── bgfx.lib
└── include/
    └── bgfx/
        ├── bgfx.h
        ├── bgfxplatform.h
        └── ...
