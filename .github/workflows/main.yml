
name: Build bgfx Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bgfx
          path: bgfx
          fetch-depth: 1

      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 1

      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio solution
        shell: cmd
        run: |
          cd bgfx
          ..\bx\tools\bin\windows\genie.exe --with-shared-lib vs2022

      - name: Build bgfx
        shell: cmd
        run: |
          cd bgfx
          msbuild .build\projects\vs2022\bgfx.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=x64

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # Entire generated .build directory
          Copy-Item `
            "bgfx\.build" `
            "release\.build" `
            -Recurse

          # All bgfx C/C++ headers
          Copy-Item `
            "bgfx\include" `
            "release\include" `
            -Recurse

          # Official C# bindings
          if (Test-Path "bgfx\bindings") {
            Copy-Item `
              "bgfx\bindings" `
              "release\bindings" `
              -Recurse
          }
          else {
            Write-Error "bgfx bindings directory was not found."
            exit 1
          }

          # bgfx scripts
          if (Test-Path "bgfx\scripts") {
            Copy-Item `
              "bgfx\scripts" `
              "release\scripts" `
              -Recurse
          }

          # bgfx examples
          if (Test-Path "bgfx\examples") {
            Copy-Item `
              "bgfx\examples" `
              "release\examples" `
              -Recurse
          }

          # bgfx tools
          if (Test-Path "bgfx\tools") {
            Copy-Item `
              "bgfx\tools" `
              "release\tools" `
              -Recurse
          }

          # Important source/build metadata
          Copy-Item "bgfx\LICENSE" "release\LICENSE"
          Copy-Item "bgfx\README.md" "release\README.md"

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "release\*" `
            -DestinationPath "bgfx-windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-windows-x64
          path: bgfx-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bgfx-windows-x64-${{ github.run_number }}
          name: bgfx Windows x64 build ${{ github.run_number }}
          generate_release_notes: true
          files: bgfx-windows-x64.zip
