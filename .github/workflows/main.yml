
name: Build bgfx Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bgfx
          path: bgfx
          fetch-depth: 1

      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 1

      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio solution
        shell: cmd
        run: |
          cd bgfx
          ..\bx\tools\bin\windows\genie.exe --with-shared-lib vs2022

      - name: Build bgfx
        shell: cmd
        run: |
          cd bgfx
          msbuild .build\projects\vs2022\bgfx.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=x64

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\bin | Out-Null
          New-Item -ItemType Directory -Force -Path release\lib | Out-Null
          New-Item -ItemType Directory -Force -Path release\include | Out-Null
          New-Item -ItemType Directory -Force -Path release\bindings\cs | Out-Null

          $build = "bgfx\.build\win64_vs2022"
          $bin = "$build\bin"
          $lib = "$build\lib"

          # Find DLL
          $dll = Get-ChildItem $bin -Filter "*.dll" -Recurse |
            Where-Object { $_.Name -like "*bgfx*" } |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "bgfx DLL was not found."
            exit 1
          }

          # Find LIB
          $implib = Get-ChildItem $lib -Filter "*.lib" -Recurse |
            Where-Object { $_.Name -like "*bgfx*" } |
            Select-Object -First 1

          if (-not $implib) {
            Write-Error "bgfx LIB was not found."
            exit 1
          }

          Copy-Item $dll.FullName "release\bin\bgfx.dll"
          Copy-Item $implib.FullName "release\lib\bgfx.lib"

          # C/C++ headers
          Copy-Item "bgfx\include\bgfx" "release\include" -Recurse

          # Official C# bindings
          if (Test-Path "bgfx\bindings\cs") {
            Copy-Item "bgfx\bindings\cs\*" `
              "release\bindings\cs" `
              -Recurse
          }
          else {
            Write-Error "C# bindings directory was not found."
            exit 1
          }

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release\* `
            -DestinationPath bgfx-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-windows-x64
          path: bgfx-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bgfx-windows-x64-${{ github.run_number }}
          name: bgfx Windows x64 build ${{ github.run_number }}
          generate_release_notes: true
          files: bgfx-windows-x64.zip
